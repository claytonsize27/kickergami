name: Kickergami Backfill

on:
  workflow_dispatch:
    inputs:
      historical_csv_path:
        description: "Path in the repo or mounted workspace to normalized historical CSV"
        required: true
        default: "sample_data/historical_sample.csv"

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: kickergami/requirements.txt

      - name: Install dependencies
        working-directory: kickergami
        run: pip install -r requirements.txt

      - name: Run historical backfill
        working-directory: kickergami
        run: python scripts/backfill_historical.py "${{ inputs.historical_csv_path }}"

